<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>Phone Sync — Library</title>
<!-- Inline favicon: the server has no /favicon.ico route, so without this every
     page load logged a 401 for it in the browser console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4f6f4'/%3E%3Crect x='6' y='9' width='20' height='14' rx='1.5' fill='none' stroke='%2312161a' stroke-width='1.8'/%3E%3Crect x='6' y='21' width='20' height='2' fill='%23e0301c'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/gallery.css" />
</head>
<body>
  <div class="shell">
    <!-- The only furniture on the page, built out of the same parts as a month
         rule. Not sticky: the page is the photographs. -->
    <header class="rail">
      <span class="rail__label edge">Library</span>
      <span class="rail__rule"></span>
      <span class="rail__note edge" id="note"></span>
      <span class="rail__count edge" id="count"></span>
      <button type="button" class="rail__action edge" id="refresh">Refresh</button>
      <button type="button" class="rail__action edge" id="logout">Sign out</button>
    </header>

    <section class="stream" aria-label="Photographs and films">
      <div id="grid"></div>
      <p class="stream__empty" id="empty" hidden>No media has been synced yet.</p>
      <div id="sentinel"></div>
      <div class="stream__foot" id="foot"></div>
    </section>
  </div>

  <!-- The detail view. One frame, as large as the screen allows, in the dark. -->
  <div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Full screen view">
    <div class="detail__backdrop" id="detail-backdrop"></div>
    <div class="detail__panel" id="detail-panel" tabindex="-1">
      <div class="detail__stage" id="detail-stage"></div>
      <p class="detail__edge" id="detail-edge"></p>
    </div>
    <button type="button" class="detail__close" id="detail-close" aria-label="Close (Escape)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <path d="M5 5l14 14M19 5L5 19" />
      </svg>
    </button>
  </div>

  <div class="login" id="login">
    <form class="login__card" id="login-form">
      <h1 class="login__title">Phone Sync</h1>
      <p class="login__lede">Sign in to browse your backed-up library.</p>
      <input class="login__field" id="username" placeholder="Username" autocomplete="username" value="jason" />
      <input class="login__field" id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <p class="login__err" id="login-err"></p>
      <button class="login__submit" type="submit" id="login-btn">Sign in</button>
    </form>
  </div>

  <script src="/gallery.js"></script>
</body>
</html>
