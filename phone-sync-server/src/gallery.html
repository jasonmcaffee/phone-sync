<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Phone Sync — Library</title>
<!-- Inline favicon: the server has no /favicon.ico route, so without this every
     page load logged a 401 for it in the browser console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f12'/%3E%3Crect x='10' y='5' width='12' height='22' rx='2.5' fill='none' stroke='%232f7bf6' stroke-width='2'/%3E%3Ccircle cx='16' cy='23' r='1.4' fill='%232f7bf6'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0d0f12; --panel: #16191f; --line: #262b33;
    --text: #e8eaed; --muted: #9aa3af; --accent: #2f7bf6; --green: #34c759; --red: #ff453a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top));
    background: rgba(13,15,18,.85);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .count { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  button:hover { border-color: #3a4150; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  /* Grid */
  .month {
    grid-column: 1 / -1; padding: 18px 6px 6px;
    font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .3px;
  }
  #grid {
    display: grid; gap: 3px; padding: 3px;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  }
  @media (min-width: 720px) { #grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); } }
  .tile {
    position: relative; aspect-ratio: 1; background: var(--panel);
    overflow: hidden; cursor: pointer; border-radius: 2px;
  }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Thumbnails fade in so the grid doesn't flash white boxes while paging. */
  .tile img { opacity: 0; transition: opacity .18s ease; }
  .tile img.ready { opacity: 1; }
  .tile .fallback {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px; color: var(--muted);
    text-align: center; padding: 8px; font-size: 12px;
  }
  .tile .fallback .ext { font-weight: 700; color: var(--text); font-size: 15px; letter-spacing: .5px; }
  .badge {
    position: absolute; padding: 2px 6px; border-radius: 20px;
    font-size: 11px; font-weight: 600; background: rgba(0,0,0,.55); color: #fff;
  }
  .badge.type { left: 6px; top: 6px; display: flex; align-items: center; gap: 4px; }
  .badge.dur { right: 6px; bottom: 6px; }
  .tile .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .tile .play svg { width: 38px; height: 38px; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); opacity: .95; }

  /* Paging */
  #sentinel { height: 1px; }
  #paging { text-align: center; color: var(--muted); font-size: 13px; padding: 22px 12px 40px; }
  .spinner {
    display: inline-block; width: 16px; height: 16px; vertical-align: -3px; margin-right: 8px;
    border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Lightbox */
  #lightbox {
    position: fixed; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.94);
  }
  #lightbox.open { display: flex; }
  #lightbox .stage {
    max-width: 96vw; max-height: 88vh; display: flex; align-items: center; justify-content: center;
  }
  #lightbox img, #lightbox video { max-width: 96vw; max-height: 88vh; border-radius: 6px; }
  #lightbox .lb-fallback { color: var(--muted); text-align: center; max-width: 460px; padding: 20px; line-height: 1.6; }
  #lightbox .lb-fallback a { color: var(--accent); }
  #lightbox .lb-fallback .why { font-size: 13px; color: var(--muted); margin-top: 10px; }
  .lb-btn {
    position: absolute; top: max(16px, env(safe-area-inset-top)); background: rgba(30,33,40,.7);
    border: 1px solid var(--line); width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  #lb-close { right: 16px; }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 48px; height: 48px; border-radius: 50%; font-size: 22px;
    background: rgba(30,33,40,.6); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  #lb-prev { left: 16px; } #lb-next { right: 16px; }
  .lb-caption {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 13px; background: rgba(30,33,40,.6);
    padding: 6px 12px; border-radius: 20px; max-width: 84vw; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* Login */
  #login {
    position: fixed; inset: 0; z-index: 30; display: flex;
    align-items: center; justify-content: center; background: var(--bg);
  }
  #login .card {
    width: min(360px, 90vw); background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px;
  }
  #login h2 { margin: 0 0 4px; text-align: center; }
  #login p { margin: 0 0 8px; text-align: center; color: var(--muted); font-size: 13px; }
  #login input {
    font: inherit; color: var(--text); background: #0f1216; border: 1px solid var(--line);
    border-radius: 8px; padding: 11px 12px;
  }
  #login .err { color: var(--red); font-size: 13px; text-align: center; min-height: 16px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
</style>
</head>
<body>
  <header>
    <h1>Library</h1>
    <span class="count" id="count"></span>
    <span class="spacer"></span>
    <button id="refresh">Refresh</button>
    <button id="logout">Sign out</button>
  </header>

  <div id="grid"></div>
  <div id="sentinel"></div>
  <div id="paging"></div>
  <div class="empty" id="empty" style="display:none">No media has been synced yet.</div>

  <!-- Lightbox -->
  <div id="lightbox">
    <button class="lb-btn" id="lb-close" title="Close (Esc)">✕</button>
    <button class="lb-nav" id="lb-prev" title="Previous (←)">‹</button>
    <div class="stage" id="lb-stage"></div>
    <button class="lb-nav" id="lb-next" title="Next (→)">›</button>
    <div class="lb-caption" id="lb-caption"></div>
  </div>

  <!-- Login -->
  <div id="login">
    <form class="card" id="login-form">
      <h2>Phone Sync</h2>
      <p>Sign in to view your backed-up media.</p>
      <input id="username" placeholder="Username" autocomplete="username" value="jason" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <div class="err" id="login-err"></div>
      <button class="primary" type="submit" id="login-btn">Sign In</button>
    </form>
  </div>

<script>
const TOKEN_KEY = "phonesync_token";
// One screenful plus a comfortable buffer. The library runs to thousands of
// items and tens of gigabytes, so the grid is filled a page at a time as you
// scroll rather than waiting on one enormous listing.
const PAGE_SIZE = 120;

let token = localStorage.getItem(TOKEN_KEY);
let items = [];          // everything loaded so far, newest first
let total = 0;           // library size reported by the server
let loading = false;     // a page request is in flight
let exhausted = false;   // every page has been loaded
let lastMonthLabel = null;
let current = -1;

const $ = (id) => document.getElementById(id);

/** Builds an authenticated media URL (token as query param for <img>/<video>). */
function mediaURL(id, kind) {
  const suffix = kind ? `/${kind}` : "";
  return `/media/${id}${suffix}?token=${encodeURIComponent(token)}`;
}

/**
 * Picks the URL that will actually render in a browser for a full-screen view.
 * HEIC is most of this library and no browser decodes it, so those go to the
 * server-rendered JPEG preview; anything a browser handles natively is served
 * as its original bytes at full quality.
 */
function displayURL(item) {
  return item.browser_displayable ? mediaURL(item.id) : mediaURL(item.id, "preview");
}

/** Uppercased file extension, for fallback tiles and messages. */
function ext(filename) {
  const dot = filename.lastIndexOf(".");
  return dot >= 0 ? filename.slice(dot + 1).toUpperCase() : "FILE";
}

/** "August 2026" heading for an item's capture date, used to group the grid. */
function monthLabel(createdAt) {
  const date = new Date(createdAt);
  if (isNaN(date)) return "Undated";
  return date.toLocaleString(undefined, { month: "long", year: "numeric" });
}

/** Human-readable size for the lightbox caption. */
function megabytes(bytes) {
  return bytes >= 1073741824 ? `${(bytes / 1073741824).toFixed(2)} GB` : `${(bytes / 1048576).toFixed(1)} MB`;
}

/** Signs in against the backend and stores the returned token. */
async function login(username, password) {
  const res = await fetch("/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password }),
  });
  if (!res.ok) throw new Error("Invalid username or password.");
  const data = await res.json();
  token = data.token;
  localStorage.setItem(TOKEN_KEY, token);
}

/** Clears the session and shows the login screen. */
function logout() {
  token = null;
  localStorage.removeItem(TOKEN_KEY);
  $("login").style.display = "flex";
}

/** Throws the grid away and reloads from the first page. */
async function reload() {
  items = [];
  total = 0;
  exhausted = false;
  lastMonthLabel = null;
  $("grid").innerHTML = "";
  await loadNextPage();
}

/**
 * Fetches the next page of the library and appends it to the grid. Guarded so
 * overlapping scroll events can't request the same page twice.
 */
async function loadNextPage() {
  if (loading || exhausted || !token) return;
  loading = true;
  $("paging").innerHTML = `<span class="spinner"></span>Loading…`;

  try {
    const res = await fetch(`/api/media?offset=${items.length}&limit=${PAGE_SIZE}`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (res.status === 401) { logout(); return; }
    if (!res.ok) throw new Error(`listing failed (${res.status})`);

    const data = await res.json();
    total = data.count || 0;
    const page = data.items || [];
    const firstIndex = items.length;
    items = items.concat(page);
    appendTiles(page, firstIndex);

    // Trust the count, but stop on a short page too, so a listing that shrinks
    // underneath us can't spin forever.
    exhausted = items.length >= total || page.length === 0;
    $("count").textContent = total ? `${items.length.toLocaleString()} of ${total.toLocaleString()}` : "";
    $("empty").style.display = total ? "none" : "block";
    $("paging").textContent = exhausted ? (total ? "End of library" : "") : "";
  } catch (err) {
    $("paging").innerHTML = `Couldn't load more — <button id="retry">retry</button>`;
    $("retry").onclick = () => { $("paging").textContent = ""; loadNextPage(); };
    return;
  } finally {
    loading = false;
  }

  // A short first page may not reach the sentinel, so keep going until the
  // viewport is actually covered.
  if (!exhausted && $("sentinel").getBoundingClientRect().top < window.innerHeight * 2) {
    loadNextPage();
  }
}

/**
 * Appends one page of tiles, inserting a month heading when the month changes.
 * @param page - the items just fetched, already concatenated onto `items`
 * @param firstIndex - index of `page[0]` within `items`, so a tile can open the
 *                     lightbox at the right position in the whole library
 */
function appendTiles(page, firstIndex) {
  const fragment = document.createDocumentFragment();
  page.forEach((item, i) => {
    const label = monthLabel(item.created_at);
    if (label !== lastMonthLabel) {
      lastMonthLabel = label;
      const heading = document.createElement("div");
      heading.className = "month";
      heading.textContent = label;
      fragment.appendChild(heading);
    }
    fragment.appendChild(makeTile(item, firstIndex + i));
  });
  $("grid").appendChild(fragment);
}

/** Creates a single grid tile for an item. */
function makeTile(item, index) {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.onclick = () => openLightbox(index);

  // The server thumbnails every format (ffmpeg reassembles HEIC tile grids and
  // grabs a video frame), so a plain <img> works for everything in the library.
  const img = document.createElement("img");
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = item.filename;
  img.src = mediaURL(item.id, "thumb");
  img.onload = () => img.classList.add("ready");
  img.onerror = () => {
    tile.innerHTML = fallbackHTML(item);
    if (item.media_type === "video") tile.insertAdjacentHTML("beforeend", videoBadgeHTML());
  };
  tile.appendChild(img);

  if (item.media_type === "video") {
    tile.insertAdjacentHTML("beforeend", videoBadgeHTML());
  }
  return tile;
}

/** Video badge + play overlay markup. */
function videoBadgeHTML() {
  return `<span class="badge type">▶ Video</span>
          <span class="play"><svg viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></span>`;
}

/** Fallback markup for a tile whose thumbnail could not be rendered. */
function fallbackHTML(item) {
  return `<div class="fallback"><span class="ext">${ext(item.filename)}</span><span>${item.filename}</span></div>`;
}

/** Opens the maximized lightbox at the given item index. */
function openLightbox(index) {
  current = index;
  renderLightbox();
  $("lightbox").classList.add("open");
}

/** Closes the lightbox and stops any playback. */
function closeLightbox() {
  $("lightbox").classList.remove("open");
  // Emptying the stage detaches the <video>, which cancels its in-flight range
  // requests; without that a closed 4K clip keeps streaming in the background.
  $("lb-stage").innerHTML = "";
}

/** Renders the current item (image or playable video) in the lightbox. */
function renderLightbox() {
  const item = items[current];
  if (!item) return;
  const stage = $("lb-stage");
  stage.innerHTML = "";
  const folder = item.rel_path ? ` · ${item.rel_path}` : "";
  $("lb-caption").textContent = `${item.filename} · ${megabytes(item.size)}${folder}`;
  stage.appendChild(item.media_type === "video" ? videoElement(item) : imageElement(item));
}

/**
 * Builds the player for a video. The poster is the cached thumbnail so there is
 * something on screen immediately, and `preload="metadata"` means pressing play
 * pulls only the ranges needed rather than the whole file — which matters when
 * the largest clip here is nearly 5 GB.
 */
function videoElement(item) {
  const video = document.createElement("video");
  video.src = mediaURL(item.id);
  video.poster = mediaURL(item.id, "thumb");
  video.controls = true;
  video.autoplay = true;
  video.playsInline = true;
  video.preload = "metadata";
  video.onerror = () => {
    // iPhone clips are HEVC. Safari plays them; a browser without an HEVC
    // decoder cannot, and says so here instead of showing a dead player.
    $("lb-stage").innerHTML = unplayableHTML(item);
  };
  return video;
}

/** Builds the <img> for a still, falling back to the original bytes. */
function imageElement(item) {
  const img = document.createElement("img");
  img.alt = item.filename;
  img.src = displayURL(item);
  img.onerror = () => {
    // The rendered preview failed; the original may still be displayable.
    if (!img.dataset.retried && !item.browser_displayable) {
      img.dataset.retried = "1";
      img.src = mediaURL(item.id);
      return;
    }
    $("lb-stage").innerHTML = undisplayableHTML(item);
  };
  return img;
}

/** Message shown when the browser has no decoder for a video. */
function unplayableHTML(item) {
  return `<div class="lb-fallback">
    <b>${item.filename}</b> won't play in this browser.
    <div class="why">iPhone video is HEVC (H.265) in a QuickTime container. Safari plays it natively;
    Chrome and Firefox need an HEVC decoder from the OS.</div>
    <p><a href="${mediaURL(item.id)}" download="${item.filename}">Download ${item.filename}</a> (${megabytes(item.size)})</p>
  </div>`;
}

/** Message shown when neither the preview nor the original can be displayed. */
function undisplayableHTML(item) {
  return `<div class="lb-fallback">
    Can't preview <b>${ext(item.filename)}</b> in this browser.
    <p><a href="${mediaURL(item.id)}" download="${item.filename}">Download ${item.filename}</a> (${megabytes(item.size)})</p>
  </div>`;
}

/** Moves to the previous/next item, loading more of the library if needed. */
function navigate(delta) {
  if (current < 0 || !items.length) return;
  const next = current + delta;
  if (next >= items.length) {
    // Walking off the end of what's loaded pulls the next page rather than
    // wrapping around to the start of a library you haven't seen all of.
    if (!exhausted) loadNextPage().then(() => { if (next < items.length) { current = next; renderLightbox(); } });
    return;
  }
  current = (next + items.length) % items.length;
  renderLightbox();
}

// --- Event wiring ---
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-err").textContent = "";
  try {
    await login($("username").value.trim(), $("password").value);
    $("login").style.display = "none";
    await reload();
  } catch (err) {
    $("login-err").textContent = err.message;
  }
});
$("logout").onclick = logout;
$("refresh").onclick = reload;
$("lb-close").onclick = closeLightbox;
$("lb-prev").onclick = () => navigate(-1);
$("lb-next").onclick = () => navigate(1);
$("lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") closeLightbox(); });
document.addEventListener("keydown", (e) => {
  if (!$("lightbox").classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") navigate(-1);
  else if (e.key === "ArrowRight") navigate(1);
});

// Infinite scroll: load the next page as the bottom of the grid approaches.
new IntersectionObserver((entries) => {
  if (entries.some((entry) => entry.isIntersecting)) loadNextPage();
}, { rootMargin: "800px" }).observe($("sentinel"));

// --- Bootstrap ---
if (token) {
  $("login").style.display = "none";
  reload();
}
</script>
</body>
</html>
