name: PhoneSync
options:
  bundleIdPrefix: com.jasonmcaffee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "A7L778FFNA"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO

targets:
  PhoneSync:
    type: application
    platform: iOS
    sources:
      - path: PhoneSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonmcaffee.phonesync
        INFOPLIST_FILE: PhoneSync/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1"

  PhoneSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhoneSyncTests
    dependencies:
      - target: PhoneSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonmcaffee.phonesync.tests
        GENERATE_INFOPLIST_FILE: YES

  PhoneSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PhoneSyncUITests
    dependencies:
      - target: PhoneSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonmcaffee.phonesync.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PhoneSync:
    build:
      targets:
        PhoneSync: all
        PhoneSyncTests: [test]
        PhoneSyncUITests: [test]
    test:
      targets:
        - PhoneSyncTests
        - PhoneSyncUITests
